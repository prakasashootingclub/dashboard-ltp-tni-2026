<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Pembayaran — LTP TNI 2026</title>
<script>
  window.onerror = function(msg, src, line, col, err){
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#B4483A;color:#fff;padding:10px;font-size:12px;font-family:monospace;word-break:break-word;";
    d.textContent = "JS ERROR: " + msg + " (baris " + line + ")";
    document.body ? document.body.prepend(d) : window.addEventListener("DOMContentLoaded", function(){ document.body.prepend(d); });
  };
</script>
<style>
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,'Segoe UI',sans-serif;
    background:#0E1210; color:#E9EAE3; margin:0; padding:16px;
    max-width:560px; margin-left:auto; margin-right:auto;
  }
  h2{font-size:18px; margin:0 0 4px;}
  .lbl{font-size:11px; text-transform:uppercase; color:#5B6660; letter-spacing:.08em; margin-bottom:14px;}

  /* ---------- gerbang password ---------- */
  #gate{
    min-height:80vh; background:#0E1210; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px;
  }
  #gate input{
    width:100%; max-width:280px; padding:12px 14px; border-radius:6px;
    border:1px solid #2A322C; background:#161B17; color:#E9EAE3; font-size:15px;
  }
  #gate button{
    width:100%; max-width:280px; padding:12px; border-radius:6px; border:none;
    background:#5C7A3A; color:#0E1210; font-size:14px; font-weight:700;
  }
  #gate .err{color:#E58B7A; font-size:13px; min-height:16px;}
  .hidden{display:none !important;}

  /* ---------- pilih pos materi ---------- */
  #pilihMateri{
    min-height:80vh; background:#0E1210; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:20px;
  }
  #pilihMateri .materi-btn{
    width:100%; max-width:280px; padding:16px; border-radius:8px;
    border:1px solid #2A322C; background:#161B17; color:#E9EAE3;
    font-size:15px; font-weight:700;
  }
  #pilihMateri .materi-btn:active{background:#5C7A3A; color:#0E1210;}
  .pos-aktif{
    font-size:11px; color:#8C9A8A; margin-bottom:10px;
  }
  .pos-aktif button{
    background:none; border:none; color:#5b8fd6; text-decoration:underline;
    font-size:11px; padding:0; margin-left:6px;
  }

  #cariInput{
    width:100%; padding:10px 12px; border-radius:6px; border:1px solid #2A322C;
    background:#161B17; color:#E9EAE3; font-size:14px; margin-bottom:14px;
  }

  #refreshBtn{
    width:100%; padding:10px; border-radius:6px; border:1px solid #2A322C;
    background:#161B17; color:#8FB35A; font-size:13px; font-weight:600; margin-bottom:14px;
  }
  #list{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:#161B17; border:1px solid #2A322C; border-radius:8px; padding:14px;
  }
  .card .nama{font-size:15px; font-weight:700; margin-bottom:2px;}
  .card .meta{font-size:12px; color:#9ba488; line-height:1.6; margin-bottom:10px;}
  .card .meta b{color:#c68a2e;}
  .card .biaya{font-family:monospace; color:#8FB35A; font-weight:700;}
  .card .warn{color:#E5A94A; font-size:11px; margin-top:4px; margin-bottom:10px;}
  .card .tunai{color:#8FB35A; font-size:11px; margin-top:4px; margin-bottom:10px;}
  .card a.bukti{
    display:inline-block; font-size:12px; color:#5b8fd6; text-decoration:none;
    border:1px solid #2A322C; padding:6px 10px; border-radius:6px; margin-bottom:10px;
  }
  .card .upload-input{ display:none; }
  .card label.upload-btn{
    display:inline-block; font-size:12px; color:#0E1210; background:#c68a2e;
    padding:8px 12px; border-radius:6px; font-weight:700; cursor:pointer; margin-bottom:6px;
  }
  .card label.upload-lbl{
    display:inline-block; font-size:11px; color:#5b8fd6; text-decoration:underline;
    cursor:pointer; margin-left:10px; margin-bottom:10px;
  }
  .card .upload-status{ font-size:11px; color:#9ba488; margin-bottom:8px; }
  .card .confirm-recap{
    font-size:12px; color:#c9cfc4; background:#0E1210; border:1px solid #2A322C;
    border-radius:6px; padding:10px; line-height:1.6; margin-bottom:8px;
  }
  .card .row-btn{display:flex; gap:8px;}
  .card .row-btn.confirm-wrap{flex-direction:column; align-items:stretch;}
  .card .confirm-actions{display:flex; gap:8px; margin-top:8px;}
  .card button.lunas{
    flex:1; padding:11px; border-radius:6px; border:none;
    background:#5C7A3A; color:#0E1210; font-size:13px; font-weight:700;
  }
  .card button.lunas:disabled{background:#3a4a3a; color:#8C9A8A;}
  .card button.batal{
    flex:1; padding:11px; border-radius:6px; border:1px solid #2A322C;
    background:#161B17; color:#9ba488; font-size:13px; font-weight:700;
  }
  .card button.ya-lunas{
    flex:2; padding:11px; border-radius:6px; border:none;
    background:#5C7A3A; color:#0E1210; font-size:13px; font-weight:700;
  }
  .card a.wa-btn{
    display:block; text-align:center; margin-top:8px; padding:11px;
    border-radius:6px; background:#25D366; color:#0E1210; font-size:13px;
    font-weight:700; text-decoration:none;
  }
  #empty{
    text-align:center; color:#5B6660; padding:40px 20px; font-size:14px;
  }
  #status{font-size:12px; color:#5B6660; margin-bottom:10px;}

  /* ---------- kirim ulang e-tiket (peserta sudah Lunas) ---------- */
  .resend-section{
    margin-top:28px; padding-top:18px; border-top:1px solid #2A322C;
  }
  #cariLunasInput{
    width:100%; padding:10px 12px; border-radius:6px; border:1px solid #2A322C;
    background:#161B17; color:#E9EAE3; font-size:14px; margin-bottom:10px;
  }
  #cariLunasBtn{
    width:100%; padding:10px; border-radius:6px; border:1px solid #2A322C;
    background:#161B17; color:#c68a2e; font-size:13px; font-weight:600; margin-bottom:14px;
  }
  #statusLunas{font-size:12px; color:#5B6660; margin-bottom:10px;}
  #listLunas{display:flex; flex-direction:column; gap:10px;}
</style>
</head>
<body>

<div id="gate">
  <h2>Verifikasi Pembayaran</h2>
  <input type="password" id="pwInput" placeholder="Password petugas" autocomplete="off">
  <button id="pwBtn">Masuk</button>
  <div class="err" id="pwErr"></div>
</div>

<div id="pilihMateri" class="hidden">
  <h2>Pos Materi Mana?</h2>
  <div class="lbl" style="margin-bottom:10px;">Pilih materi yang dijaga di pos ini</div>
  <button class="materi-btn" data-materi="Senapan">Senapan</button>
  <button class="materi-btn" data-materi="Pistol">Pistol</button>
  <button class="materi-btn" data-materi="Tembak Reaksi IPSC Level II">IPSC Level II</button>
  <button class="materi-btn" data-materi="Air Rifle">Air Rifle</button>
</div>

<div id="app" class="hidden">
  <h2>Verifikasi Pembayaran</h2>
  <div class="pos-aktif">Pos: <b id="posAktifLabel"></b><button id="gantiPosBtn">Ganti</button></div>
  <div class="resend-section" style="margin-top:0; padding-top:0; border-top:none;">
    <div class="lbl">Peserta sudah Lunas minta dikirim ulang e-tiket?</div>
    <input type="text" id="cariLunasInput" placeholder="Cari Nama, NIK, Email, atau No HP...">
    <button id="cariLunasBtn">Cari Peserta</button>
    <div id="statusLunas"></div>
    <div id="listLunas"></div>
  </div>

  <div class="lbl" style="margin-top:24px; padding-top:18px; border-top:1px solid #2A322C;">Cek bukti transfer dulu sebelum tap "Lunas"</div>
  <input type="text" id="cariInput" placeholder="Cari nama atau NIK...">
  <button id="refreshBtn">Muat Ulang Daftar</button>
  <div id="status"></div>
  <div id="list"></div>
  <div id="empty" class="hidden">Tidak ada peserta yang menunggu verifikasi saat ini.</div>
</div>

<script>
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyGY8Pi3gBALM8GVP6XCB04P_eebPw2thlP_ShQR6IVC31vuCZcWXxQK677crIgHysu/exec";
  var STORAGE_KEY = "pembayaranPw";
  var MATERI_KEY = "pembayaranMateri";
  var semuaItem = []; // hasil fetch terakhir (belum difilter materi/cari) -- dipakai ulang saat cari diketik, tidak perlu fetch ulang ke server

  // Nama tampilan SAJA (label lebih ringkas) -- nilai materi/kategori yang
  // dipakai buat filter & dikirim ke server TETAP "Tembak Reaksi IPSC Level
  // II", tidak diubah.
  var NAMA_TAMPILAN_MATERI = { "Tembak Reaksi IPSC Level II": "IPSC Level II" };
  function namaTampilanMateri(materi){ return NAMA_TAMPILAN_MATERI[materi] || materi; }

  function fmtRupiah(n){
    n = Number(n) || 0;
    return "Rp" + n.toLocaleString("id-ID");
  }

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // Upload gambar bukti transfer (dipilih admin dari file lokal, mis. hasil
  // screenshot bukti yang dikirim peserta via WA) -- dikonversi ke base64
  // lalu dikirim ke action "upload_bukti_admin". Server simpan ke Drive dan
  // isi kolom "Bukti Transfer URL", baru setelah itu tombol Lunas terbuka.
  function pasangUploadHandler(input, item, statusEl, onSuccess){
    input.addEventListener("change", function(){
      var file = input.files[0];
      if (!file) return;
      if (statusEl) statusEl.textContent = "Mengupload...";
      var reader = new FileReader();
      reader.onload = function(){
        var base64 = String(reader.result).split(",")[1];
        var pw = sessionStorage.getItem(STORAGE_KEY);
        fetch(WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "upload_bukti_admin", idPendaftaran: item.idPendaftaran, base64: base64, mimeType: file.type, pw: pw })
        })
          .then(function(r){ return r.json(); })
          .then(function(res){
            if (!res.ok) {
              if (statusEl) statusEl.textContent = res.pesan || "Gagal upload.";
              return;
            }
            item.buktiUrl = res.buktiUrl;
            semuaItem.forEach(function(it){ if (it.idPendaftaran === item.idPendaftaran) it.buktiUrl = res.buktiUrl; });
            onSuccess();
          })
          .catch(function(err){
            if (statusEl) statusEl.textContent = "Gagal terhubung ke server: " + err;
          });
      };
      reader.readAsDataURL(file);
    });
  }

  // Tombol "Tandai Lunas" TIDAK langsung eksekusi -- tampilkan dulu recap
  // data peserta + tombol Ya/Batal, supaya petugas sempat cek ulang datanya
  // benar sebelum verifikasi beneran jalan (permintaan Kang 27 Agustus 2026).
  function tampilkanKonfirmasi(item, card){
    var box = card.querySelector(".row-btn");
    box.classList.add("confirm-wrap");
    box.innerHTML =
      '<div class="confirm-recap">Cek ulang sebelum verifikasi:<br>' +
        '<b>' + escapeHtml(item.nama) + '</b><br>' +
        escapeHtml(namaTampilanMateri(item.kategori)) + ' &middot; ' + escapeHtml(item.item) + '<br>' +
        'Golongan: ' + escapeHtml(item.golongan) + ' &middot; Metode: ' + escapeHtml(item.metodeBayar || "-") + '<br>' +
        'Total: <b>' + fmtRupiah(item.biaya) + '</b>' +
      '</div>' +
      '<div class="confirm-actions">' +
        '<button class="batal">Batal</button>' +
        '<button class="ya-lunas">Ya, Data Benar -- Tandai Lunas</button>' +
      '</div>';
    box.querySelector(".batal").onclick = function(){ terapkanFilter(); };
    box.querySelector(".ya-lunas").onclick = function(){
      tandaiLunas(item.idPendaftaran, card, box.querySelector(".ya-lunas"), box);
    };
  }

  function renderList(items){
    var list = document.getElementById("list");
    var empty = document.getElementById("empty");
    list.innerHTML = "";
    if (!items.length) {
      empty.classList.remove("hidden");
      return;
    }
    empty.classList.add("hidden");
    items.forEach(function(item){
      var card = document.createElement("div");
      card.className = "card";
      card.dataset.id = item.idPendaftaran;

      var isTunai = (item.metodeBayar || "").indexOf("Tunai") === 0;
      var bisaVerifikasi = isTunai || !!item.buktiUrl;
      var buktiHtml;
      if (isTunai) {
        buktiHtml = '<div class="tunai">Bayar Tunai -- konfirmasi langsung dari petugas di venue, tidak ada bukti transfer.</div>';
      } else if (item.buktiUrl) {
        buktiHtml =
          '<a class="bukti" href="' + escapeHtml(item.buktiUrl) + '" target="_blank" rel="noopener">Lihat Bukti Transfer &rarr;</a>' +
          '<label class="upload-lbl" data-role="reupload">Ganti/upload ulang</label><br>' +
          '<input type="file" accept="image/*,application/pdf" class="upload-input" data-role="input">';
      } else {
        buktiHtml =
          '<div class="warn">Bukti transfer belum ada -- upload dulu foto/screenshot yang dikirim peserta via WA. Tombol Lunas terkunci sampai ada bukti.</div>' +
          '<label class="upload-btn" data-role="upload">Upload Bukti Transfer</label>' +
          '<input type="file" accept="image/*,application/pdf" class="upload-input" data-role="input">' +
          '<div class="upload-status" data-role="status"></div>';
      }

      card.innerHTML =
        '<div class="nama">' + escapeHtml(item.nama) + '</div>' +
        '<div class="meta">' +
          escapeHtml(namaTampilanMateri(item.kategori)) + ' &middot; ' + escapeHtml(item.item) + '<br>' +
          'HP: ' + escapeHtml(item.hp) + ' &middot; Golongan: ' + escapeHtml(item.golongan) + '<br>' +
          'Metode: <b>' + escapeHtml(item.metodeBayar || "-") + '</b> &middot; Total: <b class="biaya">' + fmtRupiah(item.biaya) + '</b>' +
        '</div>' +
        buktiHtml +
        '<div class="row-btn"><button class="lunas"' + (bisaVerifikasi ? '' : ' disabled') + '>' +
          (bisaVerifikasi ? 'Tandai Lunas' : 'Upload Bukti Dulu') + '</button></div>';

      var fileInput = card.querySelector('[data-role="input"]');
      if (fileInput) {
        var statusEl = card.querySelector('[data-role="status"]');
        pasangUploadHandler(fileInput, item, statusEl, terapkanFilter);
        var lbl = card.querySelector('[data-role="upload"], [data-role="reupload"]');
        if (lbl) lbl.onclick = function(e){ e.preventDefault(); fileInput.click(); };
      }

      if (bisaVerifikasi) {
        card.querySelector(".lunas").onclick = function(){
          tampilkanKonfirmasi(item, card);
        };
      }

      list.appendChild(card);
    });
  }

  // Filter list yang sedang tampil sesuai materi pos ini + kata kunci cari
  // (nama atau NIK) -- semuanya dari data yang sudah di-fetch, tidak perlu
  // panggil server lagi tiap kali ketik.
  function terapkanFilter(){
    var status = document.getElementById("status");
    var materi = sessionStorage.getItem(MATERI_KEY);
    var q = document.getElementById("cariInput").value.trim().toLowerCase();

    var hasil = semuaItem.filter(function(item){
      return item.kategori === materi;
    });
    if (q) {
      hasil = hasil.filter(function(item){
        return String(item.nama || "").toLowerCase().indexOf(q) !== -1 ||
          String(item.nik || "").toLowerCase().indexOf(q) !== -1;
      });
    }
    status.textContent = hasil.length + " peserta menunggu verifikasi" + (q ? " (hasil cari)" : " -- " + materi) + ".";
    renderList(hasil);
  }

  function muatDaftar(){
    var status = document.getElementById("status");
    status.textContent = "Memuat...";
    var pw = sessionStorage.getItem(STORAGE_KEY);
    fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "list_pending_pembayaran", pw: pw })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) {
          status.textContent = res.pesan || "Gagal memuat daftar.";
          return;
        }
        semuaItem = res.data;
        terapkanFilter();
      })
      .catch(function(err){
        status.textContent = "Gagal terhubung ke server: " + err;
      });
  }

  function tandaiLunas(idPendaftaran, card, btn, box){
    btn.disabled = true;
    btn.textContent = "Memproses...";
    var pw = sessionStorage.getItem(STORAGE_KEY);
    fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "tandai_lunas", idPendaftaran: idPendaftaran, pw: pw })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) {
          alert(res.pesan || "Gagal menandai Lunas.");
          terapkanFilter(); // reset kartu ke tampilan normal (batal konfirmasi)
          return;
        }
        // Ganti ISI box konfirmasi (bukan cuma tombolnya) -- box tetap ada
        // di kartu SAMPAI admin reload daftar manual, TIDAK auto-hilang,
        // supaya tombol WA (kalau ada) selalu sempat kelihatan & bisa
        // ditekan kapan saja tanpa buru-buru.
        if (res.waLink) {
          // emailDikirim === false berarti sudah masuk masa OTS -- email
          // dimatikan otomatis, tombol WA ini SATU-SATUNYA jalur e-tiket
          // sampai ke peserta. emailDikirim === true (periode online) --
          // email tetap jalan, tombol WA ini cuma cadangan/tambahan.
          box.innerHTML =
            (res.emailDikirim === false
              ? '<div class="tunai">Masa OTS -- email dimatikan, kirim e-tiket lewat tombol ini:</div>'
              : '<div class="tunai">Lunas -- e-tiket sudah dikirim otomatis ke email peserta. Tombol di bawah cadangan kalau mau kirim manual juga:</div>') +
            '<a class="wa-btn" href="' + res.waLink + '" target="_blank" rel="noopener">Kirim E-Tiket via WhatsApp</a>';
        } else {
          box.innerHTML = '<div class="tunai">Lunas -- e-tiket sudah terkirim.</div>';
        }
      })
      .catch(function(err){
        btn.disabled = false;
        btn.textContent = "Ya, Data Benar -- Tandai Lunas";
        alert("Gagal terhubung ke server: " + err);
      });
  }

  document.getElementById("refreshBtn").onclick = muatDaftar;
  document.getElementById("cariInput").addEventListener("input", terapkanFilter);

  // ---------- Kirim ulang e-tiket (peserta sudah Lunas) ----------
  // Terpisah dari daftar utama di atas (yang cuma isi peserta BELUM
  // Lunas) -- ini khusus buat kasus peserta minta dikirim ulang karena
  // pesan WA lama hilang/terhapus. Dicari langsung ke server tiap klik
  // Cari (bukan filter dari data yang sudah di-fetch), soalnya daftar
  // utama tidak pernah memuat peserta yang sudah Lunas sama sekali.
  // Peserta yang sudah Lunas dari SEBELUM fitur upload bukti admin ada
  // (27 Agustus 2026) kolom buktiUrl-nya kosong -- lewat pencarian ini
  // adminnya bisa lampirkan belakangan (backfill) kalau masih punya
  // simpanan foto bukti dari WA peserta itu. Sama sekali tidak wajib --
  // status Lunas & e-tiket peserta lama TIDAK terpengaruh ada/tidaknya
  // bukti ini, cuma pelengkap arsip.
  function renderListLunas(items){
    var list = document.getElementById("listLunas");
    list.innerHTML = "";
    items.forEach(function(item){
      var card = document.createElement("div");
      card.className = "card";

      var buktiHtml;
      if (item.buktiUrl) {
        buktiHtml =
          '<a class="bukti" href="' + escapeHtml(item.buktiUrl) + '" target="_blank" rel="noopener">Lihat Bukti Transfer &rarr;</a>' +
          '<label class="upload-lbl" data-role="reupload">Ganti/upload ulang</label><br>' +
          '<input type="file" accept="image/*,application/pdf" class="upload-input" data-role="input">';
      } else {
        buktiHtml =
          '<div class="warn">Belum ada bukti transfer tersimpan (daftar sebelum fitur ini ada) -- upload kalau masih punya foto buktinya.</div>' +
          '<label class="upload-btn" data-role="upload">Upload Bukti Transfer</label>' +
          '<input type="file" accept="image/*,application/pdf" class="upload-input" data-role="input">' +
          '<div class="upload-status" data-role="status"></div>';
      }

      card.innerHTML =
        '<div class="nama">' + escapeHtml(item.nama) + '</div>' +
        '<div class="meta">' +
          escapeHtml(namaTampilanMateri(item.kategori)) + ' &middot; ' + escapeHtml(item.item) + '<br>' +
          'NIK: ' + escapeHtml(item.nik) + ' &middot; HP: ' + escapeHtml(item.hp) + '<br>' +
          'Email: ' + escapeHtml(item.email || "-") +
        '</div>' +
        buktiHtml +
        (item.waLink
          ? '<a class="wa-btn" href="' + item.waLink + '" target="_blank" rel="noopener">Kirim Ulang E-Tiket via WhatsApp</a>'
          : '<div class="warn">QR e-tiket belum tersedia untuk peserta ini -- cek manual di Spreadsheet.</div>');

      var fileInput = card.querySelector('[data-role="input"]');
      if (fileInput) {
        var statusEl = card.querySelector('[data-role="status"]');
        pasangUploadHandler(fileInput, item, statusEl, function(){ renderListLunas(items); });
        var lbl = card.querySelector('[data-role="upload"], [data-role="reupload"]');
        if (lbl) lbl.onclick = function(e){ e.preventDefault(); fileInput.click(); };
      }

      list.appendChild(card);
    });
  }

  function cariLunas(){
    var statusLunas = document.getElementById("statusLunas");
    var q = document.getElementById("cariLunasInput").value.trim();
    if (!q) { statusLunas.textContent = "Isi kata kunci pencarian dulu."; document.getElementById("listLunas").innerHTML = ""; return; }
    statusLunas.textContent = "Mencari...";
    var pw = sessionStorage.getItem(STORAGE_KEY);
    fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "cari_lunas", kueri: q, pw: pw })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) { statusLunas.textContent = res.pesan || "Gagal mencari."; return; }
        statusLunas.textContent = res.data.length
          ? res.data.length + " peserta ditemukan."
          : "Tidak ada peserta Lunas yang cocok dengan pencarian ini.";
        renderListLunas(res.data);
      })
      .catch(function(err){
        statusLunas.textContent = "Gagal terhubung ke server: " + err;
      });
  }

  document.getElementById("cariLunasBtn").onclick = cariLunas;
  document.getElementById("cariLunasInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") cariLunas();
  });

  // Hash SHA-256 dari password yang benar -- bukan password mentahnya --
  // supaya tidak kelihatan polos di kode sumber halaman ini.
  var PW_HASH = "9d79c8a98cba3879964958e8b60f05741f020e2eddc92126c5c76882d0793b3c";
  function sha256Hex(text){
    var data = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", data).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function unlock(pw){
    document.getElementById("gate").classList.add("hidden");
    sessionStorage.setItem(STORAGE_KEY, pw);
    var materi = sessionStorage.getItem(MATERI_KEY);
    if (materi) {
      bukaApp(materi);
    } else {
      document.getElementById("pilihMateri").classList.remove("hidden");
    }
  }

  function bukaApp(materi){
    sessionStorage.setItem(MATERI_KEY, materi);
    document.getElementById("pilihMateri").classList.add("hidden");
    document.getElementById("posAktifLabel").textContent = namaTampilanMateri(materi);
    document.getElementById("app").classList.remove("hidden");
    muatDaftar();
  }

  document.querySelectorAll(".materi-btn").forEach(function(btn){
    btn.onclick = function(){ bukaApp(btn.getAttribute("data-materi")); };
  });

  document.getElementById("gantiPosBtn").onclick = function(){
    sessionStorage.removeItem(MATERI_KEY);
    document.getElementById("app").classList.add("hidden");
    document.getElementById("pilihMateri").classList.remove("hidden");
  };

  document.getElementById("pwBtn").onclick = function(){
    var pw = document.getElementById("pwInput").value.trim();
    if (!pw) { document.getElementById("pwErr").textContent = "Isi password dulu."; return; }
    document.getElementById("pwErr").textContent = "";
    sha256Hex(pw).then(function(hash){
      if (hash !== PW_HASH) {
        document.getElementById("pwErr").textContent = "Password salah.";
        return;
      }
      unlock(pw);
    });
  };
  document.getElementById("pwInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") document.getElementById("pwBtn").click();
  });

  var saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved) unlock(saved);
</script>

</body>
</html>
