<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1210">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<title>Dana Masuk — LTP TNI 2026</title>
<script>
  window.onerror = function(msg, src, line, col, err){
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#B4483A;color:#fff;padding:10px;font-size:12px;font-family:monospace;word-break:break-word;";
    d.textContent = "JS ERROR: " + msg + " (baris " + line + ")";
    document.body ? document.body.prepend(d) : window.addEventListener("DOMContentLoaded", function(){ document.body.prepend(d); });
  };
</script>
<style>
  :root{
    --bg:#0E1210;
    --panel:#161B17;
    --panel-2:#1D2420;
    --line:#2A322C;
    --ink:#E9EAE3;
    --ink-dim:#8C9A8A;
    --ink-faint:#5B6660;
    --olive:#5C7A3A;
    --olive-bright:#8FB35A;
    --amber:#C7852E;
    --amber-bright:#E5A94A;
    --red:#B4483A;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(143,179,90,0.09), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    padding:28px 20px 60px;
    min-height:100vh;
  }
  .wrap{max-width:1180px; margin:0 auto;}
  .hidden{display:none !important;}

  /* ---------- gerbang password ---------- */
  #gate{
    min-height:80vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:20px;
  }
  #gate h2{font-size:20px;}
  #gate input{
    width:100%; max-width:280px; padding:12px 14px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:15px;
  }
  #gate button{
    width:100%; max-width:280px; padding:12px; border-radius:6px; border:none;
    background:var(--olive); color:var(--bg); font-size:14px; font-weight:700;
  }
  #gate .err{color:#E58B7A; font-size:13px; min-height:16px;}

  /* ---------- header ---------- */
  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:18px; margin-bottom:22px; flex-wrap:wrap; gap:14px;
  }
  .brand-eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.18em;
    color:var(--olive-bright); text-transform:uppercase; margin-bottom:6px;
  }
  h1{font-size:26px; font-weight:700; letter-spacing:-0.01em;}
  .subtitle{font-size:13px; color:var(--ink-dim); margin-top:4px;}
  #refreshBtn{
    font-family:var(--mono); font-size:12px; padding:9px 16px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel); color:var(--amber-bright);
    cursor:pointer; transition:.15s;
  }
  #refreshBtn:hover{border-color:var(--amber);}
  #lastSync{font-size:11px; color:var(--ink-faint); font-family:var(--mono); text-align:right; margin-top:6px;}

  /* ---------- total besar ---------- */
  .total-box{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:32px 24px; text-align:center; margin-bottom:26px;
  }
  .total-box .angka{
    font-family:var(--mono); font-size:48px; font-weight:700; color:var(--olive-bright);
    word-break:break-word;
  }
  .total-box .ket{font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.1em; margin-top:8px;}

  /* ---------- grid rincian ---------- */
  .rincian-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:20px;
  }
  .rincian-block{
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px;
  }
  .rincian-block.full{grid-column:1 / -1;}
  .section-title{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:14px;
  }
  .rincian-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 0; border-bottom:1px solid var(--line); gap:12px;
  }
  .rincian-row:last-child{border-bottom:none;}
  .rincian-row .nama{font-size:13.5px; font-weight:600; color:var(--ink);}
  .rincian-row .kanan{text-align:right; flex-shrink:0;}
  .rincian-row .dana{font-family:var(--mono); font-size:14px; font-weight:700; color:var(--olive-bright);}
  .rincian-row .jumlah{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .empty{text-align:center; color:var(--ink-faint); padding:16px 0; font-size:12.5px;}

  /* ---------- rincian sejajar kiri-kanan (dipakai Per Golongan) ---------- */
  .rincian-side{display:flex; gap:12px;}
  .rincian-side .rincian-row{
    flex:1; flex-direction:column; align-items:flex-start; gap:6px;
    border-bottom:none; padding:0; border-right:1px solid var(--line); padding-right:12px;
  }
  .rincian-side .rincian-row:last-child{border-right:none; padding-right:0;}
  .rincian-side .rincian-row .kanan{text-align:left;}

  footer{
    margin-top:30px; padding-top:16px; border-top:1px solid var(--line);
    font-size:11px; color:var(--ink-faint); font-family:var(--mono);
  }

  /* ---------- MOBILE ---------- */
  @media(max-width:700px){
    body{padding:16px 12px 40px;}
    header{flex-direction:column; align-items:flex-start; gap:10px;}
    h1{font-size:20px;}
    #refreshBtn{width:100%;}
    #lastSync{text-align:left;}
    .total-box{padding:22px 16px;}
    .total-box .angka{font-size:32px;}
    .rincian-grid{grid-template-columns:1fr;}
    .rincian-block{padding:14px;}
  }
</style>
</head>
<body>

<div id="gate">
  <h2>Dana Masuk</h2>
  <input type="password" id="pwInput" placeholder="Password petugas" autocomplete="off">
  <button id="pwBtn">Masuk</button>
  <div class="err" id="pwErr"></div>
</div>

<div id="app" class="hidden">
  <div class="wrap">
    <header>
      <div>
        <div class="brand-eyebrow">LTP TNI 2026 &middot; Internal</div>
        <h1>Dana Masuk</h1>
        <div class="subtitle">Total uang yang sudah terverifikasi Lunas</div>
      </div>
      <div>
        <button id="refreshBtn">&#8635; Muat Ulang</button>
        <div id="lastSync">Terakhir diperbarui: &mdash;</div>
      </div>
    </header>

    <div class="total-box">
      <div class="angka" id="totalAngka">Rp0</div>
      <div class="ket">Total Dana Masuk (Lunas)</div>
    </div>

    <div class="rincian-grid">
      <div class="rincian-block full">
        <div class="section-title">Per Kategori</div>
        <div id="rincianKategori"></div>
      </div>

      <div class="rincian-block full">
        <div class="section-title">Per Metode Pembayaran</div>
        <div id="rincianMetode" class="rincian-side"></div>
      </div>

      <div class="rincian-block full">
        <div class="section-title">Per Sumber Pendaftaran</div>
        <div id="rincianSumber" class="rincian-side"></div>
      </div>

      <div class="rincian-block full">
        <div class="section-title">Per Golongan</div>
        <div id="rincianGolongan" class="rincian-side"></div>
      </div>
    </div>

    <footer>Sumber data: Google Sheets (auto-sync Apps Script)</footer>
  </div>
</div>

<script>
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyGY8Pi3gBALM8GVP6XCB04P_eebPw2thlP_ShQR6IVC31vuCZcWXxQK677crIgHysu/exec";
  var STORAGE_KEY = "pembayaranPw";

  // Falling Plate & Non IPSC menumpang kolom kategori "Pistol"/"Tembak
  // Reaksi IPSC Level II" di Sheet (sama seperti Pistol/IPSC), jadi HARUS
  // dibedakan lewat nama item juga, bukan cuma kategori -- sama persis
  // logika yang sudah dipakai di data-peserta.html & index.html.
  var FALLING_PLATE_ITEMS = [
    "Falling Plate Optic", "Falling Plate Non Optic",
    "Falling Plate Optic (TNI/Polri)", "Falling Plate Non Optic (TNI/Polri)"
  ];
  var NON_IPSC_ITEMS = ["Non IPSC Standard Putra", "Non IPSC Standard Putri"];

  function namaMateriTampil(kategori, item){
    if (kategori === "Pistol") return FALLING_PLATE_ITEMS.indexOf(item) !== -1 ? "Falling Plate" : "Eksekutif";
    if (kategori === "Tembak Reaksi IPSC Level II") return NON_IPSC_ITEMS.indexOf(item) !== -1 ? "Non IPSC" : "IPSC Level II";
    return kategori;
  }

  // Urutan tetap materi -- sama seperti Dashboard Panitia & Data Peserta.
  var URUTAN_MATERI = ["Senapan", "Eksekutif", "Falling Plate", "IPSC Level II", "Non IPSC", "Air Rifle"];

  var SUMBER_LABEL = { online: "Online", ots: "OTS" };
  var GOLONGAN_LABEL = { tni: "TNI/Polri", sipil: "Sipil" };

  function fmtRupiah(n){
    n = Number(n) || 0;
    return "Rp" + n.toLocaleString("id-ID");
  }

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // Lengkapi daftar dengan kategori yang belum ada datanya (Rp0/0 peserta)
  // -- supaya kartu Per Metode/Per Sumber/Per Golongan selalu tampil semua
  // pilihan yang mungkin, tidak cuma yang sudah ada transaksinya. Permintaan
  // Kang, 2 September 2026.
  function lengkapiKategori(rows, daftarKunci, keyFn, buatBaris){
    var ada = {};
    rows.forEach(function(r){ ada[keyFn(r)] = true; });
    daftarKunci.forEach(function(k){
      if (!ada[k]) rows.push(buatBaris(k));
    });
    return rows;
  }

  function renderRincian(elId, rows, namaFn, jumlahLabel, urutFn){
    var el = document.getElementById(elId);
    if (!rows.length) { el.innerHTML = '<div class="empty">Belum ada data.</div>'; return; }
    rows.sort(urutFn || function(a, b){ return b.dana - a.dana; });
    el.innerHTML = rows.map(function(r){
      return '<div class="rincian-row">' +
        '<div><div class="nama">' + escapeHtml(namaFn(r)) + '</div></div>' +
        '<div class="kanan"><div class="dana">' + fmtRupiah(r.dana) + '</div>' +
          '<div class="jumlah">' + r.jumlah + ' ' + jumlahLabel + '</div></div>' +
      '</div>';
    }).join("");
  }

  function muatData(){
    var pw = sessionStorage.getItem(STORAGE_KEY);
    document.getElementById("lastSync").textContent = "Memuat...";
    fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "ringkasan_dana", pw: pw })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) {
          document.getElementById("lastSync").textContent = res.pesan || "Gagal memuat.";
          return;
        }
        var d = res.data;
        document.getElementById("totalAngka").textContent = fmtRupiah(d.total);
        document.getElementById("lastSync").textContent = "Terakhir diperbarui: " + new Date(d.diperbarui).toLocaleTimeString("id-ID");

        renderRincian("rincianKategori", d.perKategori, function(r){
          return namaMateriTampil(r.kategori, r.item) + " · " + r.item + " · " + (GOLONGAN_LABEL[r.golongan] || r.golongan);
        }, "peserta", function(a, b){
          var ia = URUTAN_MATERI.indexOf(namaMateriTampil(a.kategori, a.item));
          var ib = URUTAN_MATERI.indexOf(namaMateriTampil(b.kategori, b.item));
          if (ia !== ib) return ia - ib;
          if (a.item !== b.item) return a.item < b.item ? -1 : 1;
          return a.golongan < b.golongan ? -1 : 1;
        });

        var metodeLengkap = lengkapiKategori(d.perMetode, ["Transfer Bank", "Tunai"], function(r){ return r.metode; },
          function(k){ return { metode: k, dana: 0, jumlah: 0 }; });
        renderRincian("rincianMetode", metodeLengkap, function(r){ return r.metode; }, "peserta",
          function(a, b){ return ["Transfer Bank", "Tunai"].indexOf(a.metode) - ["Transfer Bank", "Tunai"].indexOf(b.metode); });

        var sumberLengkap = lengkapiKategori(d.perSumber, ["online", "ots"], function(r){ return r.sumber; },
          function(k){ return { sumber: k, dana: 0, jumlah: 0 }; });
        renderRincian("rincianSumber", sumberLengkap, function(r){ return SUMBER_LABEL[r.sumber] || r.sumber; }, "peserta",
          function(a, b){ return ["online", "ots"].indexOf(a.sumber) - ["online", "ots"].indexOf(b.sumber); });

        var golonganLengkap = lengkapiKategori(d.perGolongan, ["sipil", "tni"], function(r){ return r.golongan; },
          function(k){ return { golongan: k, dana: 0, jumlah: 0 }; });
        renderRincian("rincianGolongan", golonganLengkap, function(r){ return GOLONGAN_LABEL[r.golongan] || r.golongan; }, "peserta",
          function(a, b){ return ["sipil", "tni"].indexOf(a.golongan) - ["sipil", "tni"].indexOf(b.golongan); });
      })
      .catch(function(err){
        document.getElementById("lastSync").textContent = "Gagal terhubung ke server: " + err;
      });
  }

  document.getElementById("refreshBtn").onclick = muatData;

  function unlock(pw){
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    sessionStorage.setItem(STORAGE_KEY, pw);
    muatData();
    setInterval(muatData, 30000);
  }

  // Password TERPISAH dari halaman Verifikasi Pembayaran (permintaan Kang,
  // 2 September 2026) -- Dana Masuk cuma tampilkan rekap, tidak ada aksi
  // ubah data, jadi bisa dibagikan ke orang yang perlu lihat rekap uang
  // tanpa ikut dapat akses Tandai Lunas/upload bukti.
  var PW_HASH = "07334386287751ba02a4588c1a0875dbd074a61bd9e6ab7c48d244eacd0c99e0";
  function sha256Hex(text){
    var data = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", data).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  document.getElementById("pwBtn").onclick = function(){
    var pw = document.getElementById("pwInput").value.trim();
    if (!pw) { document.getElementById("pwErr").textContent = "Isi password dulu."; return; }
    document.getElementById("pwErr").textContent = "";
    sha256Hex(pw).then(function(hash){
      if (hash !== PW_HASH) {
        document.getElementById("pwErr").textContent = "Password salah.";
        return;
      }
      unlock(pw);
    });
  };
  document.getElementById("pwInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") document.getElementById("pwBtn").click();
  });

  var saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved) unlock(saved);
</script>

</body>
</html>
