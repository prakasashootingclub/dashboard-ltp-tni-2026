<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1210">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<title>Penolakan OTS — LTP TNI 2026</title>
<script>
  window.onerror = function(msg, src, line, col, err){
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#B4483A;color:#fff;padding:10px;font-size:12px;font-family:monospace;word-break:break-word;";
    d.textContent = "JS ERROR: " + msg + " (baris " + line + ")";
    document.body ? document.body.prepend(d) : window.addEventListener("DOMContentLoaded", function(){ document.body.prepend(d); });
  };
</script>
<style>
  :root{
    --bg:#0E1210;
    --panel:#161B17;
    --panel-2:#1D2420;
    --line:#2A322C;
    --ink:#E9EAE3;
    --ink-dim:#8C9A8A;
    --ink-faint:#5B6660;
    --olive:#5C7A3A;
    --olive-bright:#8FB35A;
    --amber:#C7852E;
    --amber-bright:#E5A94A;
    --red:#B4483A;
    --red-bright:#E58B7A;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(180,72,58,0.09), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    padding:28px 20px 60px;
    min-height:100vh;
  }
  .wrap{max-width:820px; margin:0 auto;}
  .hidden{display:none !important;}

  /* ---------- gerbang password ---------- */
  #gate{
    min-height:80vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:20px;
  }
  #gate h2{font-size:20px;}
  #gate input{
    width:100%; max-width:280px; padding:12px 14px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:15px;
  }
  #gate button{
    width:100%; max-width:280px; padding:12px; border-radius:6px; border:none;
    background:var(--olive); color:var(--bg); font-size:14px; font-weight:700;
  }
  #gate .err{color:var(--red-bright); font-size:13px; min-height:16px;}

  /* ---------- header ---------- */
  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:18px; margin-bottom:22px; flex-wrap:wrap; gap:14px;
  }
  .brand-eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.18em;
    color:var(--red-bright); text-transform:uppercase; margin-bottom:6px;
  }
  h1{font-size:26px; font-weight:700; letter-spacing:-0.01em;}
  .subtitle{font-size:13px; color:var(--ink-dim); margin-top:4px;}
  #refreshBtn{
    font-family:var(--mono); font-size:12px; padding:9px 16px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel); color:var(--amber-bright);
    cursor:pointer; transition:.15s;
  }
  #refreshBtn:hover{border-color:var(--amber);}
  #lastSync{font-size:11px; color:var(--ink-faint); font-family:var(--mono); text-align:right; margin-top:6px;}
  .status-dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--olive-bright); margin-right:6px; vertical-align:middle;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .kosong{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:40px 20px; text-align:center; color:var(--ink-dim); font-size:14px;
  }

  /* ---------- kartu penolakan ---------- */
  .kartu{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--red);
    border-radius:8px; padding:16px 18px; margin-bottom:12px;
  }
  .kartu.baru{ border-left-color:var(--amber-bright); }
  .kartu .baris-atas{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .kartu .nama{ font-size:15px; font-weight:700; }
  .kartu .waktu{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); white-space:nowrap; }
  .kartu .meta{ font-size:12.5px; color:var(--ink-dim); margin-top:4px; }
  .kartu .alasan{
    font-size:13px; color:var(--red-bright); margin-top:10px; padding-top:10px;
    border-top:1px solid var(--line);
  }
  .kartu .aksi{ margin-top:12px; }
  .kartu .wa-btn{
    display:inline-block; font-family:var(--mono); font-size:12px; padding:8px 14px;
    border-radius:6px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--olive-bright); text-decoration:none;
  }
  .kartu .wa-btn:hover{ border-color:var(--olive); }

  footer{
    margin-top:30px; padding-top:16px; border-top:1px solid var(--line);
    font-size:11px; color:var(--ink-faint); font-family:var(--mono);
  }

  /* ---------- MOBILE ---------- */
  @media(max-width:700px){
    body{padding:16px 12px 40px;}
    header{flex-direction:column; align-items:flex-start; gap:10px;}
    h1{font-size:20px;}
    #refreshBtn{width:100%;}
    #lastSync{text-align:left;}
    .kartu .baris-atas{flex-direction:column; gap:4px;}
  }
</style>
</head>
<body>

<div id="gate">
  <h2>Penolakan OTS</h2>
  <input type="password" id="pwInput" placeholder="Password petugas" autocomplete="off">
  <button id="pwBtn">Masuk</button>
  <div class="err" id="pwErr"></div>
</div>

<div id="app" class="hidden">
  <div class="wrap">
    <header>
      <div>
        <div class="brand-eyebrow">LTP TNI 2026 &middot; Internal</div>
        <h1>Penolakan OTS</h1>
        <div class="subtitle"><span class="status-dot"></span>Pendaftaran yang ditolak sistem, terbaru duluan</div>
      </div>
      <div>
        <button id="refreshBtn">&#8635; Muat Ulang</button>
        <div id="lastSync">Terakhir diperbarui: &mdash;</div>
      </div>
    </header>

    <div id="daftar"></div>

    <footer>Auto-refresh tiap 10 detik &middot; Sumber data: Sheet "Ditolak" (auto-sync Apps Script)</footer>
  </div>
</div>

<script>
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyGY8Pi3gBALM8GVP6XCB04P_eebPw2thlP_ShQR6IVC31vuCZcWXxQK677crIgHysu/exec";
  var STORAGE_KEY = "otsDitolakPw";

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function fmtWaktu(iso){
    try {
      var d = new Date(iso);
      return d.toLocaleString("id-ID", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    } catch(e){ return iso; }
  }

  // Nomor HP kadang berisi "0813... / 0814..." (kasus 2 HP beda) --
  // link WA cuma diambil dari nomor pertama yang valid.
  function nomorWaLink(hpRaw){
    var hp = String(hpRaw || "").split("/")[0].trim().replace(/[^0-9]/g, "");
    if (!hp) return null;
    if (hp.charAt(0) === "0") hp = "62" + hp.substring(1);
    return "https://wa.me/" + hp;
  }

  var terakhirDilihat = null;

  function renderDaftar(list){
    var el = document.getElementById("daftar");
    if (!list.length) {
      el.innerHTML = '<div class="kosong">Belum ada penolakan. Aman.</div>';
      return;
    }
    el.innerHTML = list.map(function(r){
      var baru = terakhirDilihat && new Date(r.waktu) > terakhirDilihat;
      var waLink = nomorWaLink(r.hp);
      return '<div class="kartu' + (baru ? ' baru' : '') + '">' +
        '<div class="baris-atas">' +
          '<div class="nama">' + escapeHtml(r.nama) + '</div>' +
          '<div class="waktu">' + fmtWaktu(r.waktu) + '</div>' +
        '</div>' +
        '<div class="meta">' + escapeHtml(r.kategori) + ' &middot; ' + escapeHtml(r.item) + ' &middot; HP: ' + escapeHtml(r.hp) + '</div>' +
        '<div class="alasan">' + escapeHtml(r.alasan) + '</div>' +
        (waLink ? '<div class="aksi"><a class="wa-btn" href="' + waLink + '" target="_blank" rel="noopener">Chat WA &rarr;</a></div>' : '') +
      '</div>';
    }).join("");
    terakhirDilihat = new Date(list[0].waktu);
  }

  function muatData(){
    var pw = sessionStorage.getItem(STORAGE_KEY);
    document.getElementById("lastSync").textContent = "Memuat...";
    fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "list_ditolak_terbaru", pw: pw })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) {
          document.getElementById("lastSync").textContent = res.pesan || "Gagal memuat.";
          return;
        }
        renderDaftar(res.data);
        document.getElementById("lastSync").textContent = "Terakhir diperbarui: " + new Date().toLocaleTimeString("id-ID");
      })
      .catch(function(err){
        document.getElementById("lastSync").textContent = "Gagal terhubung ke server: " + err;
      });
  }

  document.getElementById("refreshBtn").onclick = muatData;

  function unlock(pw){
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    sessionStorage.setItem(STORAGE_KEY, pw);
    muatData();
    setInterval(muatData, 10000);
  }

  // Password SAMA dengan Verifikasi Pusat (SCANNER_PASSWORD_VERIFIKASI) --
  // petugas yang pegang password itu memang yang perlu pantau penolakan
  // real-time di lokasi OTS. Permintaan Kang, 4 September 2026.
  var PW_HASH = "0ffe1abd1a08215353c233d6e009613e95eec4253832a761af28ff37ac5a150c";
  function sha256Hex(text){
    var data = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", data).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  document.getElementById("pwBtn").onclick = function(){
    var pw = document.getElementById("pwInput").value.trim();
    if (!pw) { document.getElementById("pwErr").textContent = "Isi password dulu."; return; }
    document.getElementById("pwErr").textContent = "";
    sha256Hex(pw).then(function(hash){
      if (hash !== PW_HASH) {
        document.getElementById("pwErr").textContent = "Password salah.";
        return;
      }
      unlock(pw);
    });
  };
  document.getElementById("pwInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") document.getElementById("pwBtn").click();
  });

  var saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved) unlock(saved);
</script>

</body>
</html>
