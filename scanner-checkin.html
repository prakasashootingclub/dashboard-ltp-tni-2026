<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Check In Materi — LTP TNI 2026</title>
<script>
  window.onerror = function(msg, src, line, col, err){
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#B4483A;color:#fff;padding:10px;font-size:12px;font-family:monospace;word-break:break-word;";
    d.textContent = "JS ERROR: " + msg + " (baris " + line + ")";
    document.body ? document.body.prepend(d) : window.addEventListener("DOMContentLoaded", function(){ document.body.prepend(d); });
  };
</script>
<!-- Pustaka kamera di-hosting SENDIRI di sini (bukan CDN unpkg.com) --
     beberapa jaringan seluler/kebijakan jaringan memblokir domain CDN
     generik, bikin scanner macet di "Memuat pustaka kamera..." selamanya. -->
<script src="html5-qrcode.min.js?v=4" defer></script>
<style>
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,'Segoe UI',sans-serif;
    background:#0E1210; color:#E9EAE3; margin:0; padding:16px;
    max-width:480px; margin-left:auto; margin-right:auto;
  }
  h2{font-size:18px; margin:0 0 4px;}
  .lbl{font-size:11px; text-transform:uppercase; color:#5B6660; letter-spacing:.08em; margin-bottom:10px;}
  #reader{width:100%; border-radius:8px; overflow:hidden; margin-bottom:14px;}
  #result{
    padding:16px; border-radius:8px; background:#161B17; border:1px solid #2A322C;
    min-height:80px; font-size:14px; line-height:1.6; white-space:pre-line;
  }
  #result.ok{border-color:#8FB35A; background:rgba(143,179,90,0.08);}
  #result.warn{border-color:#E5A94A; background:rgba(229,169,74,0.08);}
  #result.err{border-color:#B4483A; background:rgba(180,72,58,0.08);}
  #result .pesan{margin-bottom:8px; font-weight:600;}
  #result .nama{font-weight:700; font-size:16px; margin-bottom:2px;}
  #result .meta{font-size:12.5px; color:#9ba488; line-height:1.7;}
  #result .meta a{color:#5b8fd6; text-decoration:none;}
  #result .meta a:hover{text-decoration:underline;}
  #result .foto-warn{font-size:11.5px; color:#E5A94A; margin-top:4px;}

  .cari-toggle{
    display:block; width:100%; text-align:center; margin-top:12px;
    background:none; border:none; color:#8C9A8A; font-size:12px;
    text-decoration:underline; padding:6px;
  }
  #cariBox{margin-top:12px;}
  #cariBox input{
    width:100%; padding:10px 12px; border-radius:6px; border:1px solid #2A322C;
    background:#161B17; color:#E9EAE3; font-size:14px; margin-bottom:8px;
  }
  #cariBox button.cari-btn{
    width:100%; padding:10px; border-radius:6px; border:none;
    background:#5C7A3A; color:#0E1210; font-size:13px; font-weight:700; margin-bottom:10px;
  }
  .hasil-card{
    background:#161B17; border:1px solid #2A322C; border-radius:8px; padding:12px; margin-bottom:8px;
  }
  .hasil-card .nama{font-weight:700; font-size:14px;}
  .hasil-card .meta{font-size:12px; color:#9ba488; margin:4px 0 8px;}
  .hasil-card button.verif-manual{
    width:100%; padding:9px; border-radius:6px; border:none;
    background:#5C7A3A; color:#0E1210; font-size:12px; font-weight:700;
  }
  .hasil-card button.verif-manual:disabled{background:#3a4a3a; color:#8C9A8A;}

  /* ---------- gerbang password ---------- */
  /* SENGAJA tidak pakai position:fixed -- di banyak Chrome Android, elemen
     fixed-fullscreen bisa tergeser ke luar jangkauan layar saat keyboard
     muncul, membuat tombol "Masuk" ada tapi tidak bisa disentuh. Layout
     mengalir normal supaya halaman otomatis scroll saat keyboard muncul. */
  #gate{
    min-height:80vh; background:#0E1210; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px;
  }
  #gate input{
    width:100%; max-width:280px; padding:12px 14px; border-radius:6px;
    border:1px solid #2A322C; background:#161B17; color:#E9EAE3; font-size:15px;
  }
  #gate button{
    width:100%; max-width:280px; padding:12px; border-radius:6px; border:none;
    background:#5C7A3A; color:#0E1210; font-size:14px; font-weight:700;
  }
  #gate .err{color:#E58B7A; font-size:13px; min-height:16px;}

  /* ---------- pilih pos materi ---------- */
  #pilihMateri{
    min-height:80vh; background:#0E1210; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:20px;
  }
  #pilihMateri .materi-btn{
    width:100%; max-width:280px; padding:16px; border-radius:8px;
    border:1px solid #2A322C; background:#161B17; color:#E9EAE3;
    font-size:15px; font-weight:700;
  }
  #pilihMateri .materi-btn:active{background:#5C7A3A; color:#0E1210;}
  .pos-aktif{
    font-size:11px; color:#8C9A8A; margin-bottom:10px;
  }
  .pos-aktif button{
    background:none; border:none; color:#5b8fd6; text-decoration:underline;
    font-size:11px; padding:0; margin-left:6px;
  }

  /* !important wajib -- selector ID #gate{display:flex} di atas punya
     prioritas lebih tinggi dari class .hidden, jadi tanpa !important
     gerbang password TIDAK PERNAH hilang walau class "hidden" ditambahkan. */
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="gate">
  <h2>Check In Materi</h2>
  <input type="password" id="pwInput" placeholder="Password petugas" autocomplete="off">
  <button id="pwBtn">Masuk</button>
  <div class="err" id="pwErr"></div>
  <div style="font-size:10px;color:#3A4A40;margin-top:20px;">build v6</div>
</div>

<div id="pilihMateri" class="hidden">
  <h2>Pos Materi Mana?</h2>
  <div class="lbl" style="margin-bottom:10px;">Pilih materi yang dijaga di pos ini</div>
  <button class="materi-btn" data-materi="Senapan">Senapan</button>
  <button class="materi-btn" data-materi="Pistol">Pistol</button>
  <button class="materi-btn" data-materi="Tembak Reaksi IPSC Level II">Tembak Reaksi IPSC Level II</button>
  <button class="materi-btn" data-materi="Air Rifle">Air Rifle</button>
</div>

<div id="app" class="hidden">
  <h2>Check In Materi</h2>
  <div class="pos-aktif">Pos: <b id="posAktifLabel"></b><button id="gantiPosBtn">Ganti</button></div>
  <div class="lbl">Scan QR e-tiket peserta di pos check in materi</div>
  <div id="reader"></div>
  <div id="result">Arahkan kamera ke QR e-tiket peserta.</div>

  <button class="cari-toggle" id="cariToggle">Peserta tidak punya QR? Cari manual by nama/NIK</button>
  <div id="cariBox" class="hidden">
    <input type="text" id="cariInput" placeholder="Ketik nama atau NIK...">
    <button class="cari-btn" id="cariBtn">Cari</button>
    <div id="cariStatus" style="font-size:12px;color:#5B6660;margin-bottom:8px;"></div>
    <div id="cariHasil"></div>
  </div>
</div>

<script>
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyGY8Pi3gBALM8GVP6XCB04P_eebPw2thlP_ShQR6IVC31vuCZcWXxQK677crIgHysu/exec";
  var STORAGE_KEY = "scannerPw";
  var MATERI_KEY = "scannerMateri";
  var ACTION = "scan_checkin_materi";
  var scanner = null;
  var busy = false;

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // Render hasil scan/verifikasi manual sebagai kartu data (nama, NIK, HP
  // bisa diklik, kategori/item, golongan, foto KTP) -- bukan cuma teks
  // nama+kategori seperti sebelumnya. Dipakai juga saat ditolak (belum
  // verifikasi pusat / salah pos materi) supaya petugas tetap lihat siapa
  // orangnya. Permintaan Kang, 19 Agustus 2026.
  function renderHasil(box, res, kelas){
    box.className = kelas;
    var fotoHtml = res.fotoKtpUrl
      ? '<a href="' + escapeHtml(res.fotoKtpUrl) + '" target="_blank" rel="noopener">Lihat Foto KTP &rarr;</a>'
      : '<div class="foto-warn">Tidak ada foto KTP -- cocokkan manual dengan KTP fisik.</div>';
    var hpDigits = String(res.hp || "").replace(/[^0-9]/g, "");
    var hpHtml = hpDigits
      ? '<a href="https://wa.me/' + hpDigits + '" target="_blank" rel="noopener">' + escapeHtml(res.hp) + '</a>'
      : escapeHtml(res.hp);
    box.innerHTML =
      '<div class="pesan">' + escapeHtml(res.pesan) + '</div>' +
      (res.nama ? (
        '<div class="nama">' + escapeHtml(res.nama) + '</div>' +
        '<div class="meta">NIK: ' + escapeHtml(res.ktp) + '<br>' +
        'HP: ' + hpHtml + '<br>' +
        escapeHtml(res.kategori) + ' &middot; ' + escapeHtml(res.item) + '<br>' +
        'Golongan: ' + escapeHtml(res.golongan) + '</div>' +
        fotoHtml
      ) : '');
  }

  function onScanSuccess(decodedText){
    if (busy) return;
    busy = true;
    var box = document.getElementById("result");
    box.className = "";
    box.textContent = "Memproses...";

    var pw = sessionStorage.getItem(STORAGE_KEY);
    var materi = sessionStorage.getItem(MATERI_KEY);
    fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: ACTION, etiket_id: decodedText, pw: pw, kategori_materi: materi })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res.ok){
          renderHasil(box, Object.assign({ pesan: "QR tidak dikenali atau belum lunas." }, res), "err");
        } else if(res.sudah){
          renderHasil(box, res, "warn");
        } else {
          renderHasil(box, res, "ok");
        }
      })
      .catch(function(err){
        box.className = "err";
        box.textContent = "Gagal terhubung ke server: " + err;
      })
      .finally(function(){
        setTimeout(function(){ busy = false; }, 1500);
      });
  }

  function startScanner(retries){
    retries = retries || 0;
    if (typeof Html5Qrcode === "undefined") {
      if (retries > 40) {
        var box = document.getElementById("result");
        box.className = "err";
        box.textContent = "Gagal memuat pustaka kamera (jaringan lambat/terblokir). Coba muat ulang halaman.";
        return;
      }
      document.getElementById("result").textContent = "Memuat pustaka kamera...";
      setTimeout(function(){ startScanner(retries + 1); }, 250);
      return;
    }
    scanner = new Html5Qrcode("reader");
    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    ).catch(function(err){
      var box = document.getElementById("result");
      box.className = "err";
      box.textContent = "Kamera tidak bisa dibuka: " + err +
        "\n\nPastikan izin kamera diaktifkan untuk browser ini di HP (Setelan > Situs > Kamera), lalu muat ulang halaman.";
    });
  }

  function verifikasiManual(etiketId, btn){
    btn.disabled = true;
    btn.textContent = "Memproses...";
    var pw = sessionStorage.getItem(STORAGE_KEY);
    var materi = sessionStorage.getItem(MATERI_KEY);
    fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: ACTION, etiket_id: etiketId, pw: pw, kategori_materi: materi })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) {
          btn.disabled = false;
          btn.textContent = "Check In Manual";
          alert(res.pesan || "Gagal.");
          return;
        }
        btn.textContent = res.sudah ? "Sudah pernah check in" : "Berhasil check in";
      })
      .catch(function(err){
        btn.disabled = false;
        btn.textContent = "Check In Manual";
        alert("Gagal terhubung ke server: " + err);
      });
  }

  function cariPeserta(){
    var q = document.getElementById("cariInput").value.trim();
    var statusEl = document.getElementById("cariStatus");
    var hasilEl = document.getElementById("cariHasil");
    if (!q) { statusEl.textContent = "Ketik nama atau NIK dulu."; return; }
    statusEl.textContent = "Mencari...";
    hasilEl.innerHTML = "";
    var pw = sessionStorage.getItem(STORAGE_KEY);
    fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "cari_peserta", kueri: q, pw: pw })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) { statusEl.textContent = res.pesan || "Gagal mencari."; return; }
        if (!res.data.length) { statusEl.textContent = "Tidak ada peserta Lunas yang cocok."; return; }
        statusEl.textContent = res.data.length + " hasil ditemukan.";
        res.data.forEach(function(p){
          var card = document.createElement("div");
          card.className = "hasil-card";
          var sudahVerif = p.checkinMateri === "Sudah";
          var fotoHtml = p.fotoKtpUrl
            ? '<a href="' + escapeHtml(p.fotoKtpUrl) + '" target="_blank" rel="noopener" style="display:inline-block;font-size:12px;color:#5b8fd6;margin-bottom:8px;">Lihat Foto KTP &rarr;</a><br>'
            : '<div style="font-size:11px;color:#E5A94A;margin-bottom:8px;">Tidak ada foto KTP -- cocokkan manual dengan KTP fisik.</div>';
          card.innerHTML =
            '<div class="nama">' + escapeHtml(p.nama) + '</div>' +
            '<div class="meta">NIK: ' + escapeHtml(p.ktp) + '<br>' +
            escapeHtml(p.kategori) + ' &middot; ' + escapeHtml(p.item) + '<br>' +
            'Status: ' + (sudahVerif ? 'Sudah check in materi' : 'Belum check in materi') + '</div>' +
            fotoHtml +
            '<button class="verif-manual">' + (sudahVerif ? 'Sudah pernah check in' : 'Check In Manual') + '</button>';
          var btn = card.querySelector(".verif-manual");
          if (sudahVerif) btn.disabled = true;
          btn.onclick = function(){ verifikasiManual(p.etiketId, btn); };
          hasilEl.appendChild(card);
        });
      })
      .catch(function(err){ statusEl.textContent = "Gagal terhubung ke server: " + err; });
  }

  document.getElementById("cariToggle").onclick = function(){
    document.getElementById("cariBox").classList.toggle("hidden");
  };
  document.getElementById("cariBtn").onclick = cariPeserta;
  document.getElementById("cariInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") cariPeserta();
  });

  function unlock(pw){
    document.getElementById("gate").classList.add("hidden");
    sessionStorage.setItem(STORAGE_KEY, pw);
    var materi = sessionStorage.getItem(MATERI_KEY);
    if (materi) {
      bukaApp(materi);
    } else {
      document.getElementById("pilihMateri").classList.remove("hidden");
    }
  }

  function bukaApp(materi){
    sessionStorage.setItem(MATERI_KEY, materi);
    document.getElementById("pilihMateri").classList.add("hidden");
    document.getElementById("posAktifLabel").textContent = materi;
    document.getElementById("app").classList.remove("hidden");
    if (!scanner) startScanner();
  }

  document.querySelectorAll(".materi-btn").forEach(function(btn){
    btn.onclick = function(){ bukaApp(btn.getAttribute("data-materi")); };
  });

  document.getElementById("gantiPosBtn").onclick = function(){
    sessionStorage.removeItem(MATERI_KEY);
    document.getElementById("app").classList.add("hidden");
    document.getElementById("pilihMateri").classList.remove("hidden");
  };

  // Hash SHA-256 dari password yang benar -- bukan password mentahnya --
  // supaya tidak kelihatan polos di kode sumber halaman ini.
  var PW_HASH = "5f3c989f7c088e0cd2f01d2192f72670544b3905cca1a1459ce73d415e01ac27";
  function sha256Hex(text){
    var data = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", data).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  document.getElementById("pwBtn").onclick = function(){
    var pw = document.getElementById("pwInput").value.trim();
    if (!pw) { document.getElementById("pwErr").textContent = "Isi password dulu."; return; }
    document.getElementById("pwErr").textContent = "";
    sha256Hex(pw).then(function(hash){
      if (hash !== PW_HASH) {
        document.getElementById("pwErr").textContent = "Password salah.";
        return;
      }
      unlock(pw);
    });
  };
  document.getElementById("pwInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") document.getElementById("pwBtn").click();
  });

  var saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved) unlock(saved);
</script>

</body>
</html>
